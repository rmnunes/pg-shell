name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tauri-action runs `pnpm tauri build`, then either creates or updates a
      # GitHub Release for the pushed tag and attaches the platform-native
      # bundles (.msi/.exe on Windows, .dmg/.app.tar.gz on macOS, .deb/.rpm/
      # .AppImage on Linux). The first job to reach this step creates the
      # release; subsequent jobs upload to the same one (matched by tagName).
      #
      # The signing keys feed the updater plugin: tauri-action signs each
      # bundle and uploads `latest.json` (the manifest the in-app updater
      # downloads). Required secrets:
      #   - TAURI_SIGNING_PRIVATE_KEY          contents of `~/.tauri/pg-shell.key`
      #   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD password used at `tauri signer generate`
      # See docs/UPDATES.md for the one-time key generation steps.
      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/rmnunes/pg-shell/blob/main/CHANGELOG.md) for details.

            **Downloads** — pick the file for your OS below.
          releaseDraft: false
          prerelease: false
          # Emit the signed updater manifest (`latest.json`) alongside the
          # installer artifacts. The in-app updater pulls this via the
          # `/releases/latest/download/latest.json` URL.
          updaterJsonPreferNsis: true
          includeUpdaterJson: true
