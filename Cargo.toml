[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/pg-core",
    "crates/pg-intellisense",
    "crates/pg-schema-cache",
    "crates/pg-profiles",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/rmnunes/pg-shell"
rust-version = "1.80"

[workspace.dependencies]
# Shared across crates
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
    "json",
    "bigdecimal",
] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"

# Intellisense
pg_query = "6"

# Profiles / persistence
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
directories = "5"

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2" }
tauri-plugin-updater = { version = "2" }
tauri-plugin-process = { version = "2" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
